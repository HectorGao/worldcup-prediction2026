services:
  - type: web
    name: worldcup-prediction
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn worldcup_predictor.api:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WORLDCUP_DB_PATH
        value: /opt/render/project/src/data/worldcup.sqlite3
      - key: WORLDCUP_CORS_ORIGINS
        value: https://worldcup-prediction2026.onrender.com,https://worldcup.hectorgao.com
      - key: WORLDCUP_USE_PRECOMPUTED
        value: "1"
      - key: WORLDCUP_READ_ONLY
        value: "1"
      - key: WORLDCUP_PRECOMPUTED_DIR
        value: /opt/render/project/src/precomputed
      - key: SPORTTERY_ENABLE_LIVE
        value: "0"
