[project]
name = "world-cup-prediction"
version = "0.1.0"
description = "Local-first 2026 World Cup prediction dashboard with Dixon-Coles, ELO, market calibration, simulations, and Chinese reports."
requires-python = ">=3.10"
dependencies = [
  "apscheduler>=3.10",
  "fastapi>=0.111",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "scipy>=1.11",
  "uvicorn[standard]>=0.30",
  "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]
ml = [
  "xgboost>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"
